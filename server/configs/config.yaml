# -----------------------------------------------------------------------------
# BoyKing Admin 默认运行配置（安全占位值，clone 后可直接启动）
# 说明与全部可选项见 config.example.yaml；生产环境请务必修改密钥与数据库凭据。
# -----------------------------------------------------------------------------

system:
  router-prefix: ""
  addr: 8888
  iplimit-count: 15000
  iplimit-time: 3600
  use-strict-auth: false
  disable-auto-migrate: false

zap:
  level: info
  prefix: "[boyking-admin/server]"
  format: console
  director: log
  encode-level: LowercaseColorLevelEncoder
  stacktrace-key: stacktrace
  show-line: true
  log-in-console: true
  retention-day: -1

jwt:
  signing-key: "change-this-jwt-secret"
  expires-time: 7d
  buffer-time: 1d
  issuer: boyking-admin

captcha:
  key-long: 6
  img-width: 240
  img-height: 80
  open-captcha: 1
  open-captcha-timeout: 3600

mysql:
  path: 127.0.0.1
  port: "3306"
  config: charset=utf8mb4&parseTime=True&loc=Local
  db-name: boyking_admin
  username: root
  password: "change-this-mysql-password"
  prefix: ""
  engine: ""
  log-mode: error
  max-idle-conns: 10
  max-open-conns: 100
  singular: false
  log-zap: false

redis:
  enable: false
  name: default
  addr: 127.0.0.1:6379
  password: ""
  db: 0
  useCluster: false
  clusterAddrs: []
